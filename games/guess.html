<script>

let secretNumber = 0;
let attempts = 0;


// LOAD BEST SCORE

function loadBestScore() {

  const saved = localStorage.getItem("guessNumberBest");

  if (saved !== null) {
    document.getElementById("bestScore").textContent = saved;
  } else {
    document.getElementById("bestScore").textContent = "—";
  }

}


// START NEW GAME

function startNewGame() {

  secretNumber = Math.floor(Math.random() * 100) + 1;

  attempts = 0;

  document.getElementById("currentAttempts").textContent = "0";

  document.getElementById("guessInput").value = "";

  document.getElementById("guessInput").disabled = false;

  document.getElementById("guessButton").disabled = false;

  document.getElementById("message").textContent = "";

  document.getElementById("message").className = "";

  document.getElementById("restartButton").style.display = "none";

  loadBestScore();

}


// MAKE GUESS

function makeGuess() {

  const input = document.getElementById("guessInput");

  const message = document.getElementById("message");

  const guess = Number(input.value);


  if (
    !Number.isInteger(guess) ||
    guess < 1 ||
    guess > 100
  ) {

    message.textContent =
      "⚠️ Enter a number from 1 to 100!";

    return;
  }


  attempts++;

  document.getElementById("currentAttempts").textContent =
    attempts;


  if (guess < secretNumber) {

    message.textContent =
      "⬆️ Too low!";

    input.value = "";

    return;
  }


  if (guess > secretNumber) {

    message.textContent =
      "⬇️ Too high!";

    input.value = "";

    return;
  }


  // CORRECT ANSWER

  input.disabled = true;

  document.getElementById("guessButton").disabled = true;

  document.getElementById("restartButton").style.display =
    "inline-block";


  const oldBest =
    localStorage.getItem("guessNumberBest");


  // NEW BEST

  if (
    oldBest === null ||
    attempts < Number(oldBest)
  ) {

    localStorage.setItem(
      "guessNumberBest",
      attempts
    );

    document.getElementById("bestScore").textContent =
      attempts;

    message.className = "new-best";

    message.textContent =
      "🔥 NEW BEST! " +
      attempts +
      " attempts!";

  } else {

    document.getElementById("bestScore").textContent =
      oldBest;

    message.className = "";

    message.textContent =
      "🎉 Correct! " +
      attempts +
      " attempts!";

  }

}


// ENTER KEY

document
  .getElementById("guessInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      makeGuess();
    }

  });


// START GAME

loadBestScore();

startNewGame();

</script>
