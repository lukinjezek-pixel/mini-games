<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Guess the Number | Mini Games</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #24145c 0%,
          #0b0b12 45%
        );

      color: white;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;

    }


    .game {

      width: 100%;

      max-width: 650px;

      text-align: center;

    }


    .back {

      display: inline-block;

      margin-bottom: 25px;

      color: #aaa;

      text-decoration: none;

      font-size: 16px;

    }


    .back:hover {

      color: white;

    }


    h1 {

      font-size:
        clamp(
          38px,
          9vw,
          60px
        );

      margin-bottom: 10px;

    }


    .subtitle {

      color: #999;

      font-size: 18px;

      margin-bottom: 25px;

    }


    .stats {

      display: flex;

      justify-content: center;

      gap: 15px;

      margin-bottom: 20px;

    }


    .stat {

      background: #151521;

      border: 1px solid #303047;

      border-radius: 14px;

      padding: 12px 20px;

      min-width: 140px;

    }


    .stat-title {

      color: #888;

      font-size: 13px;

      margin-bottom: 5px;

    }


    .stat-value {

      font-size: 22px;

      font-weight: bold;

    }


    .game-box {

      background: #191925;

      border: 2px solid #303047;

      border-radius: 25px;

      padding: 30px 25px;

    }


    .instruction {

      color: #aaa;

      font-size: 17px;

      margin-bottom: 22px;

    }


    .input-area {

      display: flex;

      gap: 10px;

      justify-content: center;

    }


    #guessInput {

      width: 160px;

      padding: 14px;

      border-radius: 12px;

      border: 2px solid #303047;

      background: #101018;

      color: white;

      font-size: 20px;

      text-align: center;

      outline: none;

    }


    #guessInput:focus {

      border-color: #7c5cff;

    }


    #guessButton {

      border: none;

      border-radius: 12px;

      background: #7c5cff;

      color: white;

      padding: 14px 22px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    #guessButton:hover {

      background: #947bff;

    }


    #guessButton:disabled {

      opacity: 0.5;

      cursor: not-allowed;

    }


    #message {

      min-height: 30px;

      margin-top: 22px;

      font-size: 18px;

      font-weight: bold;

    }


    #message.new-best {

      color: #5ff0b1;

    }


    #restartButton {

      display: none;

      margin-top: 18px;

      border: none;

      border-radius: 12px;

      background: #303047;

      color: white;

      padding: 12px 22px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    #restartButton:hover {

      background: #44445f;

    }


    @media (max-width: 600px) {

      .stats {

        flex-direction: row;

      }


      .stat {

        min-width: 0;

        flex: 1;

      }


      .input-area {

        flex-direction: column;

        align-items: center;

      }


      #guessInput {

        width: 100%;

        max-width: 250px;

      }


      #guessButton {

        width: 100%;

        max-width: 250px;

      }

    }

  </style>

</head>


<body>


  <div class="game">


    <a
      class="back"
      href="../index.html"
    >
      ← Back to games
    </a>


    <h1>
      🔢 Guess the Number
    </h1>


    <p class="subtitle">
      Can you guess the secret number?
    </p>


    <div class="stats">


      <div class="stat">

        <div class="stat-title">
          CURRENT
        </div>

        <div
          class="stat-value"
          id="currentAttempts"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-title">
          🏆 BEST SCORE
        </div>

        <div
          class="stat-value"
          id="bestScore"
        >
          —
        </div>

      </div>


    </div>


    <div class="game-box">


      <p class="instruction">
        Guess a number between 1 and 100.
      </p>


      <div class="input-area">


        <input
          id="guessInput"
          type="number"
          min="1"
          max="100"
          placeholder="1–100"
        >


        <button
          id="guessButton"
          onclick="makeGuess()"
        >
          GUESS
        </button>


      </div>


      <div id="message"></div>


      <button
        id="restartButton"
        onclick="startNewGame()"
      >
        PLAY AGAIN
      </button>


    </div>


  </div>


  <script>


    let secretNumber = 0;

    let attempts = 0;


    // LOAD BEST SCORE

    function loadBestScore() {

      const saved =
        localStorage.getItem(
          "guessNumberBest"
        );


      if (saved !== null) {

        document
          .getElementById("bestScore")
          .textContent = saved;

      } else {

        document
          .getElementById("bestScore")
          .textContent = "—";

      }

    }


    // START NEW GAME

    function startNewGame() {

      secretNumber =
        Math.floor(
          Math.random() * 100
        ) + 1;


      attempts = 0;


      document
        .getElementById("currentAttempts")
        .textContent = "0";


      const input =
        document.getElementById(
          "guessInput"
        );


      input.value = "";

      input.disabled = false;


      document
        .getElementById("guessButton")
        .disabled = false;


      document
        .getElementById("message")
        .textContent = "";


      document
        .getElementById("message")
        .className = "";


      document
        .getElementById("restartButton")
        .style.display = "none";


      loadBestScore();


      input.focus();

    }


    // MAKE GUESS

    function makeGuess() {


      const input =
        document.getElementById(
          "guessInput"
        );


      const message =
        document.getElementById(
          "message"
        );


      const guess =
        Number(input.value);


      // INVALID NUMBER

      if (

        !Number.isInteger(guess) ||

        guess < 1 ||

        guess > 100

      ) {

        message.textContent =
          "⚠️ Enter a number from 1 to 100!";

        return;

      }


      attempts++;


      document
        .getElementById(
          "currentAttempts"
        )
        .textContent = attempts;


      // TOO LOW

      if (
        guess < secretNumber
      ) {

        message.textContent =
          "⬆️ Too low!";

        input.value = "";

        input.focus();

        return;

      }


      // TOO HIGH

      if (
        guess > secretNumber
      ) {

        message.textContent =
          "⬇️ Too high!";

        input.value = "";

        input.focus();

        return;

      }


      // CORRECT

      input.disabled = true;


      document
        .getElementById(
          "guessButton"
        )
        .disabled = true;


      document
        .getElementById(
          "restartButton"
        )
        .style.display =
          "inline-block";


      const oldBest =
        localStorage.getItem(
          "guessNumberBest"
        );


      // NEW BEST

      if (

        oldBest === null ||

        attempts < Number(oldBest)

      ) {


        localStorage.setItem(
          "guessNumberBest",
          attempts
        );


        document
          .getElementById(
            "bestScore"
          )
          .textContent = attempts;


        message.className =
          "new-best";


        message.textContent =
          "🔥 NEW BEST! " +
          attempts +
          " attempts!";


      } else {


        document
          .getElementById(
            "bestScore"
          )
          .textContent = oldBest;


        message.className = "";


        message.textContent =
          "🎉 Correct! " +
          attempts +
          " attempts!";

      }

    }


    // ENTER KEY

    document
      .getElementById(
        "guessInput"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            makeGuess();

          }

        }
      );


    // START GAME

    loadBestScore();

    startNewGame();


  </script>


</body>

</html>
