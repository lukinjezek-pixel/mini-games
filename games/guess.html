<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Guess the Number | Mini Games</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #24145c 0%, #0b0b12 45%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game {
      width: 100%;
      max-width: 650px;
      text-align: center;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #aaa;
      text-decoration: none;
    }

    .back:hover {
      color: white;
    }

    h1 {
      font-size: clamp(38px, 9vw, 60px);
      margin-bottom: 10px;
    }

    .subtitle {
      color: #999;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .card {
      background: #151521;
      border: 1px solid #303047;
      border-radius: 25px;
      padding: 30px 20px;
      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.25);
    }

    .number {
      font-size: 55px;
      font-weight: bold;
      color: #9c7cff;
      margin-bottom: 10px;
    }

    .hint {
      color: #aaa;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .stats {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat {
      flex: 1;
      background: #0f0f18;
      border: 1px solid #303047;
      border-radius: 14px;
      padding: 15px;
    }

    .stat-title {
      color: #777;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
      color: white;
    }

    input {
      width: 100%;
      max-width: 300px;
      padding: 15px;
      border-radius: 13px;
      border: 2px solid #303047;
      background: #0f0f18;
      color: white;
      font-size: 20px;
      text-align: center;
      outline: none;
    }

    input:focus {
      border-color: #7c5cff;
    }

    button {
      border: none;
      border-radius: 13px;
      background: #7c5cff;
      color: white;
      padding: 14px 28px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 15px;
    }

    button:hover {
      background: #947bff;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #message {
      min-height: 30px;
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }

    #restartButton {
      display: none;
      background: #19c37d;
    }

    .new-best {
      color: #ffd43b;
    }

    @media (max-width: 500px) {

      .stats {
        gap: 10px;
      }

      .stat {
        padding: 12px 5px;
      }

      .stat-value {
        font-size: 20px;
      }

    }

  </style>

</head>


<body>

  <div class="game">

    <a
      class="back"
      href="../index.html"
    >
      ← Back to games
    </a>

    <h1>
      🔢 Guess the Number
    </h1>

    <p class="subtitle">
      Can you guess the secret number?
    </p>

    <div class="card">

      <div class="number">
        1–100
      </div>

      <p class="hint">
        I'm thinking of a number between 1 and 100.
      </p>

      <div class="stats">

        <div class="stat">

          <div class="stat-title">
            CURRENT
          </div>

          <div
            class="stat-value"
            id="currentAttempts"
          >
            0
          </div>

        </div>


        <div class="stat">

          <div class="stat-title">
            🏆 BEST SCORE
          </div>

          <div
            class="stat-value"
            id="bestScore"
          >
            —
          </div>

        </div>

      </div>


      <input
        id="guessInput"
        type="number"
        min="1"
        max="100"
        placeholder="Your guess"
      >

      <br>

      <button
        id="guessButton"
        onclick="makeGuess()"
      >
        GUESS
      </button>

      <p id="message"></p>

      <button
        id="restartButton"
        onclick="startNewGame()"
      >
        PLAY AGAIN
      </button>

    </div>

  </div>


  <script>

    let secretNumber = 0;
    let attempts = 0;


    // =========================
    // LOAD BEST SCORE
    // =========================

    function loadBestScore() {

      const saved =
        localStorage.getItem("guessNumberBest");

      if (saved !== null) {

        document.getElementById("bestScore").textContent =
          saved;

      } else {

        document.getElementById("bestScore").textContent =
          "—";

      }

    }


    // =========================
    // START NEW GAME
    // =========================

    function startNewGame() {

      secretNumber =
        Math.floor(Math.random() * 100) + 1;

      attempts = 0;

      document.getElementById("currentAttempts").textContent =
        "0";

      document.getElementById("guessInput").value =
        "";

      document.getElementById("guessInput").disabled =
        false;

      document.getElementById("guessButton").disabled =
        false;

      document.getElementById("message").textContent =
        "";

      document.getElementById("message").className =
        "";

      document.getElementById("restartButton").style.display =
        "none";

      loadBestScore();

    }


    // =========================
    // MAKE GUESS
    // =========================

    function makeGuess() {

      const input =
        document.getElementById("guessInput");

      const message =
        document.getElementById("message");

      const guess =
        Number(input.value);


      // CHECK INPUT

      if (
        input.value === "" ||
        guess < 1 ||
        guess > 100 ||
        !Number.isInteger(guess)
      ) {

        message.className = "";

        message.textContent =
          "⚠️ Enter a number from 1 to 100!";

        return;

      }


      // ADD ATTEMPT

      attempts++;

      document.getElementById("currentAttempts").textContent =
        attempts;


      // TOO LOW

      if (guess < secretNumber) {

        message.className = "";

        message.textContent =
          "⬆️ Too low!";

        input.value = "";

        input.focus();

        return;

      }


      // TOO HIGH

      if (guess > secretNumber) {

        message.className = "";

        message.textContent =
          "⬇️ Too high!";

        input.value = "";

        input.focus();

        return;

      }


      // =========================
      // CORRECT
      // =========================

      input.disabled = true;

      document.getElementById("guessButton").disabled =
        true;

      document.getElementById("restartButton").style.display =
        "inline-block";


      // GET OLD BEST SCORE

      const oldBest =
        localStorage.getItem("guessNumberBest");


      // =========================
      // NEW BEST
      // =========================

      if (
        oldBest === null ||
        attempts < Number(oldBest)
      ) {

        localStorage.setItem(
          "guessNumberBest",
          attempts
        );

        document.getElementById("bestScore").textContent =
          attempts;

        message.className =
          "new-best";

        message.textContent =
          "🔥 NEW BEST! " +
          attempts +
          " attempts!";

      }


      // =========================
      // NORMAL WIN
      // =========================

      else {

        document.getElementById("bestScore").textContent =
          oldBest;

        message.className =
          "";

        message.textContent =
          "🎉 Correct! " +
          attempts +
          " attempts!";

      }

    }


    // =========================
    // ENTER KEY
    // =========================

    document
      .getElementById("guessInput")
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            makeGuess();

          }

        }
      );


    // =========================
    // START GAME
    // =========================

    startNewGame();

  </script>

</body>

</html>
