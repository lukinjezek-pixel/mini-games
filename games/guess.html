<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Guess the Number | Mini Games</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #24145c 0%,
          #0b0b12 45%
        );

      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

    }


    .game {

      width: 100%;
      max-width: 650px;

      text-align: center;

    }


    .back {

      display: inline-block;

      margin-bottom: 25px;

      color: #aaa;

      text-decoration: none;

      font-size: 16px;

    }


    .back:hover {
      color: white;
    }


    h1 {

      font-size:
        clamp(
          38px,
          9vw,
          60px
        );

      margin-bottom: 10px;

    }


    .subtitle {

      color: #999;

      font-size: 18px;

      margin-bottom: 25px;

    }


    /* STATS */

    .stats {

      display: flex;

      justify-content: center;

      gap: 15px;

      margin-bottom: 20px;

    }


    .stat {

      background: #151521;

      border: 1px solid #303047;

      border-radius: 14px;

      padding: 12px 20px;

      min-width: 140px;

      transition: 0.2s;

    }


    .stat:hover {

      border-color: #7c5cff;

      transform: translateY(-3px);

    }


    .stat-title {

      color: #888;

      font-size: 13px;

      margin-bottom: 5px;

    }


    .stat-value {

      font-size: 22px;

      font-weight: bold;

    }


    /* GAME BOX */

    .game-box {

      background: #191925;

      border: 2px solid #303047;

      border-radius: 25px;

      padding: 35px 25px;

      transition: 0.2s;

    }


    .game-box.correct {

      border-color: #19c37d;

      box-shadow:
        0 0 35px rgba(
          25,
          195,
          125,
          0.25
        );

    }


    .instruction {

      color: #aaa;

      font-size: 17px;

      margin-bottom: 25px;

    }


    /* INPUT */

    .input-area {

      display: flex;

      gap: 10px;

      justify-content: center;

    }


    #guessInput {

      width: 170px;

      padding: 14px;

      border-radius: 12px;

      border: 2px solid #303047;

      background: #101018;

      color: white;

      font-size: 20px;

      text-align: center;

      outline: none;

      transition: 0.2s;

    }


    #guessInput:focus {

      border-color: #7c5cff;

      box-shadow:
        0 0 15px rgba(
          124,
          92,
          255,
          0.25
        );

    }


    #guessInput:disabled {

      opacity: 0.5;

    }


    /* GUESS BUTTON */

    #guessButton {

      border: none;

      border-radius: 12px;

      background: #7c5cff;

      color: white;

      padding: 14px 22px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;

    }


    #guessButton:hover {

      background: #947bff;

      transform: scale(1.05);

    }


    #guessButton:disabled {

      opacity: 0.5;

      cursor: not-allowed;

      transform: none;

    }


    /* MESSAGE */

    #message {

      min-height: 30px;

      margin-top: 22px;

      font-size: 18px;

      font-weight: bold;

      transition: 0.2s;

    }


    #message.new-best {

      color: #5ff0b1;

      animation: pop 0.35s ease;

    }


    #message.success {

      color: #5ff0b1;

      animation: pop 0.35s ease;

    }


    /* RESTART */

    #restartButton {

      display: none;

      margin-top: 18px;

      border: none;

      border-radius: 12px;

      background: #303047;

      color: white;

      padding: 12px 22px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;

    }


    #restartButton:hover {

      background: #44445f;

      transform: scale(1.05);

    }


    /* ANIMATION */

    @keyframes pop {

      0% {

        transform: scale(0.8);

        opacity: 0;

      }

      100% {

        transform: scale(1);

        opacity: 1;

      }

    }


    @keyframes shake {

      0%,
      100% {
        transform: translateX(0);
      }

      25% {
        transform: translateX(-6px);
      }

      75% {
        transform: translateX(6px);
      }

    }


    .shake {

      animation: shake 0.25s ease;

    }


    /* MOBILE */

    @media (max-width: 600px) {

      .stats {

        flex-direction: row;

      }


      .stat {

        min-width: 0;

        flex: 1;

      }


      .input-area {

        flex-direction: column;

        align-items: center;

      }


      #guessInput {

        width: 100%;

        max-width: 250px;

      }


      #guessButton {

        width: 100%;

        max-width: 250px;

      }

    }

  </style>

</head>


<body>


  <div class="game">


    <a
      class="back"
      href="../index.html"
    >
      ← Back to games
    </a>


    <h1>
      🔢 Guess the Number
    </h1>


    <p class="subtitle">
      Can you guess the secret number?
    </p>


    <div class="stats">


      <div class="stat">

        <div class="stat-title">
          CURRENT
        </div>

        <div
          class="stat-value"
          id="currentAttempts"
        >
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-title">
          🏆 BEST SCORE
        </div>

        <div
          class="stat-value"
          id="bestScore"
        >
          —
        </div>

      </div>


    </div>


    <div
      class="game-box"
      id="gameBox"
    >


      <p class="instruction">

        I'm thinking of a number between
        <strong>1 and 100</strong>.

      </p>


      <div class="input-area">


        <input
          id="guessInput"
          type="number"
          min="1"
          max="100"
          placeholder="1–100"
          autocomplete="off"
        >


        <button
          id="guessButton"
          onclick="makeGuess()"
        >
          GUESS
        </button>


      </div>


      <div id="message"></div>


      <button
        id="restartButton"
        onclick="startNewGame()"
      >
        🔄 PLAY AGAIN
      </button>


    </div>


  </div>


  <script>


    let secretNumber = 0;

    let attempts = 0;

    let audioContext = null;


    // =========================
    // SOUND SYSTEM
    // =========================

    function getAudioContext() {

      if (!audioContext) {

        audioContext =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

      }


      if (
        audioContext.state === "suspended"
      ) {

        audioContext.resume();

      }


      return audioContext;

    }


    function playTone(
      frequency,
      duration,
      type = "sine"
    ) {

      const audio =
        getAudioContext();


      const oscillator =
        audio.createOscillator();


      const gain =
        audio.createGain();


      oscillator.type = type;


      oscillator.frequency.setValueAtTime(
        frequency,
        audio.currentTime
      );


      gain.gain.setValueAtTime(
        0.12,
        audio.currentTime
      );


      gain.gain.exponentialRampToValueAtTime(
        0.001,
        audio.currentTime + duration
      );


      oscillator.connect(gain);

      gain.connect(
        audio.destination
      );


      oscillator.start();

      oscillator.stop(
        audio.currentTime + duration
      );

    }


    // GUESS SOUND

    function playGuessSound() {

      playTone(
        500,
        0.08,
        "sine"
      );

    }


    // TOO LOW

    function playLowSound() {

      playTone(
        280,
        0.18,
        "triangle"
      );

    }


    // TOO HIGH

    function playHighSound() {

      playTone(
        700,
        0.18,
        "triangle"
      );

    }


    // CORRECT

    function playCorrectSound() {

      const audio =
        getAudioContext();


      const notes = [
        500,
        650,
        800
      ];


      notes.forEach(
        function(
          frequency,
          index
        ) {

          const oscillator =
            audio.createOscillator();


          const gain =
            audio.createGain();


          const time =
            audio.currentTime +
            index * 0.1;


          oscillator.type =
            "sine";


          oscillator.frequency.setValueAtTime(
            frequency,
            time
          );


          gain.gain.setValueAtTime(
            0.15,
            time
          );


          gain.gain.exponentialRampToValueAtTime(
            0.001,
            time + 0.16
          );


          oscillator.connect(gain);

          gain.connect(
            audio.destination
          );


          oscillator.start(time);

          oscillator.stop(
            time + 0.16
          );

        }
      );

    }


    // NEW BEST

    function playBestSound() {

      const audio =
        getAudioContext();


      const notes = [
        600,
        800,
        1000,
        1200
      ];


      notes.forEach(
        function(
          frequency,
          index
        ) {

          const oscillator =
            audio.createOscillator();


          const gain =
            audio.createGain();


          const time =
            audio.currentTime +
            index * 0.09;


          oscillator.type =
            "square";


          oscillator.frequency.setValueAtTime(
            frequency,
            time
          );


          gain.gain.setValueAtTime(
            0.1,
            time
          );


          gain.gain.exponentialRampToValueAtTime(
            0.001,
            time + 0.14
          );


          oscillator.connect(gain);

          gain.connect(
            audio.destination
          );


          oscillator.start(time);

          oscillator.stop(
            time + 0.14
          );

        }
      );

    }


    // =========================
    // BEST SCORE
    // =========================

    function loadBestScore() {

      const saved =
        localStorage.getItem(
          "guessNumberBest"
        );


      document
        .getElementById(
          "bestScore"
        )
        .textContent =
        saved !== null
          ? saved
          : "—";

    }


    // =========================
    // NEW GAME
    // =========================

    function startNewGame() {

      secretNumber =
        Math.floor(
          Math.random() * 100
        ) + 1;


      attempts = 0;


      const input =
        document.getElementById(
          "guessInput"
        );


      input.value = "";

      input.disabled = false;


      document
        .getElementById(
          "guessButton"
        )
        .disabled = false;


      document
        .getElementById(
          "currentAttempts"
        )
        .textContent = "0";


      document
        .getElementById(
          "message"
        )
        .textContent = "";


      document
        .getElementById(
          "message"
        )
        .className = "";


      document
        .getElementById(
          "gameBox"
        )
        .className =
        "game-box";


      document
        .getElementById(
          "restartButton"
        )
        .style.display =
        "none";


      loadBestScore();


      input.focus();

    }


    // =========================
    // MAKE GUESS
    // =========================

    function makeGuess() {


      const input =
        document.getElementById(
          "guessInput"
        );


      const message =
        document.getElementById(
          "message"
        );


      const gameBox =
        document.getElementById(
          "gameBox"
        );


      const guess =
        Number(input.value);


      // INVALID

      if (

        !Number.isInteger(
          guess
        ) ||

        guess < 1 ||

        guess > 100

      ) {

        message.textContent =
          "⚠️ Enter a number from 1 to 100!";


        gameBox.classList
          .remove("shake");


        void gameBox.offsetWidth;


        gameBox.classList
          .add("shake");


        return;

      }


      attempts++;


      document
        .getElementById(
          "currentAttempts"
        )
        .textContent =
        attempts;


      playGuessSound();


      // TOO LOW

      if (
        guess < secretNumber
      ) {

        message.className = "";

        message.textContent =
          "⬆️ Too low!";


        playLowSound();


        input.value = "";

        input.focus();


        return;

      }


      // TOO HIGH

      if (
        guess > secretNumber
      ) {

        message.className = "";

        message.textContent =
          "⬇️ Too high!";


        playHighSound();


        input.value = "";

        input.focus();


        return;

      }


      // =========================
      // CORRECT
      // =========================

      input.disabled = true;


      document
        .getElementById(
          "guessButton"
        )
        .disabled = true;


      document
        .getElementById(
          "restartButton"
        )
        .style.display =
        "inline-block";


      gameBox.className =
        "game-box correct";


      const oldBest =
        localStorage.getItem(
          "guessNumberBest"
        );


      // NEW BEST

      if (

        oldBest === null ||

        attempts <
        Number(oldBest)

      ) {


        localStorage.setItem(
          "guessNumberBest",
          attempts
        );


        document
          .getElementById(
            "bestScore"
          )
          .textContent =
          attempts;


        message.className =
          "new-best";


        message.textContent =
          "🏆 NEW BEST! " +
          attempts +
          " attempts!";


        playBestSound();


      } else {


        document
          .getElementById(
            "bestScore"
          )
          .textContent =
          oldBest;


        message.className =
          "success";


        message.textContent =
          "🎉 Correct! " +
          attempts +
          " attempts!";


        playCorrectSound();

      }

    }


    // =========================
    // ENTER KEY
    // =========================

    document
      .getElementById(
        "guessInput"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (
            event.key === "Enter"
          ) {

            makeGuess();

          }

        }
      );


    // =========================
    // START
    // =========================

    loadBestScore();

    startNewGame();


  </script>


</body>

</html>
