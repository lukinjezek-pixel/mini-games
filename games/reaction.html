<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reaction Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0b0b12;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      font-size: 40px;
    }

    #info {
      color: #aaa;
      font-size: 18px;
    }

    #box {
      margin-top: 30px;
      height: 300px;
      border-radius: 20px;
      background: #191925;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
    }

    #box.waiting {
      background: #7c5cff;
    }

    #box.go {
      background: #19c37d;
    }

    button {
      margin-top: 20px;
      padding: 14px 25px;
      border: none;
      border-radius: 10px;
      background: #7c5cff;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div class="game">

  <h1>⚡ Reaction Test</h1>

  <p id="info">Klikni na START.</p>

  <div id="box">START</div>

  <button id="startButton">Nová hra</button>

</div>

<script>
  const box = document.getElementById("box");
  const info = document.getElementById("info");
  const startButton = document.getElementById("startButton");

  let startTime = 0;
  let gameRunning = false;
  let timer = null;

  startButton.addEventListener("click", function () {

    clearTimeout(timer);

    gameRunning = false;
    startTime = 0;

    box.className = "waiting";
    box.textContent = "ČEKEJ...";
    info.textContent = "Počkej na zelenou!";

    const delay = Math.floor(Math.random() * 3000) + 1500;

    timer = setTimeout(function () {

      box.className = "go";
      box.textContent = "KLIKNI!";
      info.textContent = "TEĎ!";

      startTime = Date.now();
      gameRunning = true;

    }, delay);
  });

  box.addEventListener("click", function () {

    if (!gameRunning) return;

    const reaction = Date.now() - startTime;

    gameRunning = false;

    box.className = "";
    box.textContent = reaction + " ms";

    info.textContent = "Tvoje reakce! Zkus to znovu.";
  });
</script>

</body>
</html>
