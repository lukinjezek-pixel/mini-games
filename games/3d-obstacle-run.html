<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>3D Obstacle Run | Mini Games</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:#07101c;
    color:white;
    font-family:Arial,sans-serif;
    touch-action:none;
}

#game{
    position:fixed;
    inset:0;
}

canvas{
    display:block;
}

#hud{
    position:fixed;
    top:18px;
    left:18px;
    right:18px;
    display:flex;
    justify-content:space-between;
    z-index:5;
    pointer-events:none;
}

.hudBox{
    min-width:100px;
    padding:9px 14px;
    border-radius:14px;
    background:rgba(5,12,25,.72);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 8px 25px rgba(0,0,0,.28);
    backdrop-filter:blur(7px);
}

.hudLabel{
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    opacity:.65;
}

.hudValue{
    font-size:22px;
    font-weight:800;
    margin-top:2px;
}

#back{
    position:fixed;
    top:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:7;
    border:none;
    color:white;
    background:rgba(5,12,25,.72);
    border:1px solid rgba(255,255,255,.15);
    border-radius:12px;
    padding:8px 14px;
    font-size:12px;
    cursor:pointer;
}

#menu,
#gameOver{
    position:fixed;
    inset:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at 50% 38%,
            rgba(0,170,255,.18),
            rgba(3,7,15,.94) 65%
        );
}

.panel{
    width:min(90%,430px);
    padding:34px 25px;
    text-align:center;
    border-radius:26px;
    background:rgba(7,14,28,.9);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 25px 70px rgba(0,0,0,.55);
    backdrop-filter:blur(14px);
}

h1{
    font-size:clamp(38px,9vw,58px);
    margin-bottom:9px;
    font-weight:900;
    letter-spacing:-2px;
    background:linear-gradient(
        90deg,
        #00d9ff,
        #6677ff,
        #b15cff
    );
    -webkit-background-clip:text;
    color:transparent;
}

.panel p{
    color:#c2cad8;
    line-height:1.5;
    margin-bottom:24px;
}

.mainButton{
    border:none;
    color:white;
    background:linear-gradient(
        135deg,
        #00aaff,
        #635bff
    );
    padding:15px 29px;
    border-radius:15px;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 10px 28px rgba(45,120,255,.32);
}

.mainButton:active{
    transform:scale(.95);
}

#controls{
    position:fixed;
    left:0;
    right:0;
    bottom:20px;
    display:flex;
    justify-content:center;
    gap:13px;
    z-index:6;
}

.control{
    width:68px;
    height:68px;
    border-radius:20px;
    border:1px solid rgba(255,255,255,.18);
    background:rgba(5,12,25,.72);
    color:white;
    font-size:29px;
    font-weight:bold;
    backdrop-filter:blur(8px);
    user-select:none;
}

#jump{
    background:rgba(52,104,255,.72);
}

.hidden{
    display:none !important;
}

@media(max-width:500px){

    #hud{
        top:10px;
        left:10px;
        right:10px;
    }

    .hudBox{
        min-width:82px;
        padding:7px 10px;
    }

    .hudValue{
        font-size:18px;
    }

    #back{
        top:10px;
        font-size:11px;
        padding:7px 11px;
    }

    #controls{
        bottom:15px;
        gap:9px;
    }

    .control{
        width:64px;
        height:64px;
        border-radius:18px;
    }
}

@media(min-width:700px){

    #controls{
        opacity:.65;
    }

    .control{
        width:62px;
        height:62px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

    <div class="hudBox">
        <div class="hudLabel">Score</div>
        <div class="hudValue" id="score">0</div>
    </div>

    <div class="hudBox">
        <div class="hudLabel">Best</div>
        <div class="hudValue" id="best">0</div>
    </div>

</div>

<a href="../index.html">
    <button id="back">← Mini Games</button>
</a>

<div id="menu">

    <div class="panel">

        <h1>3D RUN</h1>

        <p>
            Run through the city, dodge obstacles,
            collect coins and survive as long as possible.
            <br><br>
            PC: Arrow Keys / A & D + Space
            <br>
            Mobile: Swipe or use the buttons
        </p>

        <button class="mainButton" id="start">
            START RUN
        </button>

    </div>

</div>

<div id="gameOver" class="hidden">

    <div class="panel">

        <h1>GAME OVER</h1>

        <p>
            Your score:
            <strong id="finalScore">0</strong>

            <br><br>

            Best score:
            <strong id="finalBest">0</strong>
        </p>

        <button class="mainButton" id="restart">
            RUN AGAIN
        </button>

    </div>

</div>

<div id="controls">

    <button class="control" id="left">←</button>

    <button class="control" id="jump">↑</button>

    <button class="control" id="right">→</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

/* =========================================================
   CORE
========================================================= */

let scene;
let camera;
let renderer;
let player;

let obstacles = [];
let coins = [];

let running = false;

let score = 0;

let best =
    Number(localStorage.getItem("3dRunBest")) || 0;

let playerX = 0;
let targetX = 0;

let velocityY = 0;
let grounded = true;

let speed = 0.34;

let spawnTimer = 0;
let coinTimer = 0;

let runTime = 0;

const clock = new THREE.Clock();

const scoreEl =
    document.getElementById("score");

const bestEl =
    document.getElementById("best");

bestEl.textContent = best;


/* =========================================================
   RESPONSIVE LANES
========================================================= */

function getLaneSpacing(){

    if(window.innerWidth < 500){
        return 2.15;
    }

    if(window.innerWidth < 700){
        return 2.4;
    }

    return 3;
}

let laneSpacing = getLaneSpacing();

let lanes = [
    -laneSpacing,
    0,
    laneSpacing
];

function updateLanes(){

    laneSpacing = getLaneSpacing();

    lanes = [
        -laneSpacing,
        0,
        laneSpacing
    ];

    let closest =
        lanes.reduce(
            (a,b) =>
                Math.abs(b-targetX) <
                Math.abs(a-targetX)
                    ? b
                    : a
        );

    targetX = closest;

    playerX = THREE.MathUtils.clamp(
        playerX,
        -laneSpacing,
        laneSpacing
    );
}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera(){

    if(window.innerWidth < 500){

        camera.position.set(
            0,
            5.8,
            11.5
        );

    }else if(window.innerWidth < 700){

        camera.position.set(
            0,
            5.5,
            10
        );

    }else{

        camera.position.set(
            0,
            5.3,
            8.8
        );
    }

    camera.lookAt(
        0,
        1.25,
        -16
    );
}


/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;

function initAudio(){

    if(!audioContext){

        audioContext =
            new(
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if(audioContext.state === "suspended"){
        audioContext.resume();
    }
}

function playSound(type){

    if(!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    let startFrequency = 440;
    let endFrequency = 440;
    let duration = .1;
    let volume = .06;

    if(type === "start"){

        startFrequency = 350;
        endFrequency = 850;
        duration = .2;
        volume = .07;

        oscillator.type = "sine";
    }

    if(type === "coin"){

        startFrequency = 720;
        endFrequency = 1100;
        duration = .1;
        volume = .08;

        oscillator.type = "sine";
    }

    if(type === "jump"){

        startFrequency = 280;
        endFrequency = 600;
        duration = .13;
        volume = .055;

        oscillator.type = "sine";
    }

    if(type === "hit"){

        startFrequency = 150;
        endFrequency = 50;
        duration = .28;
        volume = .1;

        oscillator.type = "sawtooth";
    }

    oscillator.frequency.setValueAtTime(
        startFrequency,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        Math.max(1,endFrequency),
        audioContext.currentTime + duration
    );

    gain.gain.setValueAtTime(
        .001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioContext.currentTime + .01
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime + duration
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration
    );
}


/* =========================================================
   INITIALIZATION
========================================================= */

function init(){

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(0x07101c);

    scene.fog =
        new THREE.Fog(
            0x07101c,
            25,
            105
        );

    camera =
        new THREE.PerspectiveCamera(
            66,
            window.innerWidth /
            window.innerHeight,
            .1,
            180
        );

    updateCamera();

    renderer =
        new THREE.WebGLRenderer({
            antialias:false,
            powerPreference:"high-performance"
        });

    /*
       Lower pixel ratio = much better mobile performance.
    */

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            1.25
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    /*
       No dynamic shadows.
       This is intentional for smoother gameplay.
    */

    renderer.shadowMap.enabled = false;

    document
        .getElementById("game")
        .appendChild(renderer.domElement);

    createLights();
    createWorld();
    createCity();
    createPlayer();

    window.addEventListener(
        "resize",
        resize
    );

    animate();
}


/* =========================================================
   LIGHTING
========================================================= */

function createLights(){

    const hemi =
        new THREE.HemisphereLight(
            0x8fbfff,
            0x17202e,
            1.8
        );

    scene.add(hemi);

    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            1.8
        );

    sun.position.set(
        5,
        15,
        8
    );

    scene.add(sun);
}


/* =========================================================
   WORLD / ROAD
========================================================= */

function createWorld(){

    const roadMaterial =
        new THREE.MeshStandardMaterial({
            color:0x242b36,
            roughness:.9
        });

    const road =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                11,
                .35,
                190
            ),
            roadMaterial
        );

    road.position.set(
        0,
        -.2,
        -70
    );

    scene.add(road);


    /*
       Side sidewalks
    */

    const sidewalkMaterial =
        new THREE.MeshStandardMaterial({
            color:0x4a515b,
            roughness:.85
        });

    for(
        const x of [-6.2,6.2]
    ){

        const sidewalk =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.5,
                    .3,
                    190
                ),
                sidewalkMaterial
            );

        sidewalk.position.set(
            x,
            -.05,
            -70
        );

        scene.add(sidewalk);
    }


    /*
       Three lanes
    */

    const laneMaterial =
        new THREE.MeshBasicMaterial({
            color:0x6b7482
        });

    for(
        const x of [
            -laneSpacing/2,
            laneSpacing/2
        ]
    ){

        const line =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .055,
                    .025,
                    190
                ),
                laneMaterial
            );

        line.position.set(
            x,
            .015,
            -70
        );

        scene.add(line);
    }


    /*
       Center road markings.
       Recycled every frame.
    */

    const markerGeometry =
        new THREE.BoxGeometry(
            .12,
            .035,
            2.5
        );

    const markerMaterial =
        new THREE.MeshBasicMaterial({
            color:0xe8edf4
        });

    for(
        let laneX of [
            -laneSpacing/2,
            laneSpacing/2
        ]
    ){

        for(
            let z = 0;
            z > -130;
            z -= 6
        ){

            const marker =
                new THREE.Mesh(
                    markerGeometry,
                    markerMaterial
                );

            marker.position.set(
                laneX,
                .03,
                z
            );

            marker.userData.isRoadMarker = true;

            scene.add(marker);
        }
    }


    /*
       Road edge lights
    */

    const edgeGeometry =
        new THREE.BoxGeometry(
            .08,
            .08,
            1.2
        );

    const edgeMaterial =
        new THREE.MeshBasicMaterial({
            color:0x00cfff
        });

    for(
        const x of [-5.6,5.6]
    ){

        for(
            let z = 0;
            z > -130;
            z -= 4
        ){

            const light =
                new THREE.Mesh(
                    edgeGeometry,
                    edgeMaterial
                );

            light.position.set(
                x,
                .12,
                z
            );

            light.userData.isEdgeLight = true;

            scene.add(light);
        }
    }
}


/* =========================================================
   CITY
   Instanced buildings keep the number of draw calls low.
========================================================= */

let cityBuildings = [];

function createCity(){

    const buildingGeometry =
        new THREE.BoxGeometry(
            1,
            1,
            1
        );

    const buildingMaterial =
        new THREE.MeshStandardMaterial({
            color:0x26364a,
            roughness:.95
        });

    const buildingCount = 28;

    const buildings =
        new THREE.InstancedMesh(
            buildingGeometry,
            buildingMaterial,
            buildingCount
        );

    const dummy =
        new THREE.Object3D();

    for(
        let i=0;
        i<buildingCount;
        i++
    ){

        const side =
            i % 2 === 0
                ? -1
                : 1;

        const index =
            Math.floor(i/2);

        const height =
            4 +
            Math.random()*10;

        const width =
            2.5 +
            Math.random()*2.5;

        const depth =
            4 +
            Math.random()*5;

        const x =
            side *
            (8 +
            Math.random()*4);

        const z =
            5 -
            index*9 -
            Math.random()*4;

        dummy.position.set(
            x,
            height/2 - .2,
            z
        );

        dummy.scale.set(
            width,
            height,
            depth
        );

        dummy.updateMatrix();

        buildings.setMatrixAt(
            i,
            dummy.matrix
        );

        cityBuildings.push({
            mesh:buildings,
            index:i,
            x:x,
            width:width,
            height:height,
            depth:depth
        });
    }

    buildings.instanceMatrix.needsUpdate = true;

    scene.add(buildings);


    /*
       Simple windows.
       Only a few lightweight emissive blocks.
    */

    const windowGeometry =
        new THREE.BoxGeometry(
            .18,
            .25,
            .04
        );

    const windowMaterial =
        new THREE.MeshBasicMaterial({
            color:0xffd76a
        });

    const windowCount = 45;

    const windows =
        new THREE.InstancedMesh(
            windowGeometry,
            windowMaterial,
            windowCount
        );

    for(
        let i=0;
        i<windowCount;
        i++
    ){

        const side =
            i%2===0 ? -1 : 1;

        const x =
            side *
            (7.5 +
            Math.random()*5);

        const y =
            2 +
            Math.random()*9;

        const z =
            -Math.random()*115;

        dummy.position.set(
            x,
            y,
            z
        );

        dummy.scale.set(
            1,
            1,
            1
        );

        dummy.updateMatrix();

        windows.setMatrixAt(
            i,
            dummy.matrix
        );
    }

    windows.instanceMatrix.needsUpdate = true;

    scene.add(windows);


    /*
       Street lights.
    */

    createStreetLights();
}


function createStreetLights(){

    const poleGeometry =
        new THREE.CylinderGeometry(
            .045,
            .055,
            3.5,
            6
        );

    const poleMaterial =
        new THREE.MeshStandardMaterial({
            color:0x252b34,
            roughness:.8
        });

    const poles =
        new THREE.InstancedMesh(
            poleGeometry,
            poleMaterial,
            26
        );

    const dummy =
        new THREE.Object3D();

    for(
        let i=0;
        i<26;
        i++
    ){

        const side =
            i%2===0 ? -1 : 1;

        const z =
            -4 -
            Math.floor(i/2)*9;

        dummy.position.set(
            side*6.8,
            1.7,
            z
        );

        dummy.rotation.z = 0;

        dummy.updateMatrix();

        poles.setMatrixAt(
            i,
            dummy.matrix
        );
    }

    poles.instanceMatrix.needsUpdate = true;

    scene.add(poles);


    const lampGeometry =
        new THREE.SphereGeometry(
            .13,
            6,
            6
        );

    const lampMaterial =
        new THREE.MeshBasicMaterial({
            color:0xffe28a
        });

    const lamps =
        new THREE.InstancedMesh(
            lampGeometry,
            lampMaterial,
            26
        );

    for(
        let i=0;
        i<26;
        i++
    ){

        const side =
            i%2===0 ? -1 : 1;

        const z =
            -4 -
            Math.floor(i/2)*9;

        dummy.position.set(
            side*6.8,
            3.48,
            z
        );

        dummy.updateMatrix();

        lamps.setMatrixAt(
            i,
            dummy.matrix
        );
    }

    lamps.instanceMatrix.needsUpdate = true;

    scene.add(lamps);
}


/* =========================================================
   PLAYER
========================================================= */

let playerLegL;
let playerLegR;
let playerArmL;
let playerArmR;

function createPlayer(){

    player =
        new THREE.Group();


    /*
       Body
    */

    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.05,
                1.25,
                .7
            ),
            new THREE.MeshStandardMaterial({
                color:0x4e7cff,
                roughness:.45
            })
        );

    body.position.y = 1.3;

    player.add(body);


    /*
       Hoodie stripe
    */

    const stripe =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.08,
                .16,
                .72
            ),
            new THREE.MeshBasicMaterial({
                color:0x00d9ff
            })
        );

    stripe.position.y = 1.55;

    player.add(stripe);


    /*
       Head
    */

    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .43,
                12,
                10
            ),
            new THREE.MeshStandardMaterial({
                color:0xffc5a5,
                roughness:.8
            })
        );

    head.position.y = 2.25;

    player.add(head);


    /*
       Hair
    */

    const hair =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .45,
                10,
                8,
                0,
                Math.PI*2,
                0,
                Math.PI*.48
            ),
            new THREE.MeshStandardMaterial({
                color:0x20202b,
                roughness:.9
            })
        );

    hair.position.y = 2.37;

    player.add(hair);


    /*
       Legs
    */

    const legMaterial =
        new THREE.MeshStandardMaterial({
            color:0x202d4a,
            roughness:.75
        });

    playerLegL =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .28,
                .8,
                .3
            ),
            legMaterial
        );

    playerLegR =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .28,
                .8,
                .3
            ),
            legMaterial
        );

    playerLegL.position.set(
        -.28,
        .35,
        0
    );

    playerLegR.position.set(
        .28,
        .35,
        0
    );

    player.add(playerLegL);
    player.add(playerLegR);


    /*
       Arms
    */

    const armMaterial =
        new THREE.MeshStandardMaterial({
            color:0x4e7cff,
            roughness:.55
        });

    playerArmL =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .23,
                .75,
                .25
            ),
            armMaterial
        );

    playerArmR =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .23,
                .75,
                .25
            ),
            armMaterial
        );

    playerArmL.position.set(
        -.67,
        1.3,
        0
    );

    playerArmR.position.set(
        .67,
        1.3,
        0
    );

    player.add(playerArmL);
    player.add(playerArmR);


    player.position.set(
        0,
        0,
        3
    );

    scene.add(player);
}


/* =========================================================
   PLAYER ANIMATION
========================================================= */

function animatePlayer(){

    if(!running) return;

    if(grounded){

        const runWave =
            Math.sin(runTime*14);

        playerLegL.rotation.x =
            runWave*.65;

        playerLegR.rotation.x =
            -runWave*.65;

        playerArmL.rotation.x =
            -runWave*.45;

        playerArmR.rotation.x =
            runWave*.45;

        player.rotation.z =
            Math.sin(runTime*7)*.025;

        player.position.y =
            Math.abs(
                Math.sin(runTime*14)
            )*.035;
    }

    else{

        playerLegL.rotation.x = -.35;
        playerLegR.rotation.x = -.35;

        playerArmL.rotation.x = -.25;
        playerArmR.rotation.x = -.25;
    }
}


/* =========================================================
   OBSTACLES
========================================================= */

function createObstacle(){

    const laneIndex =
        Math.floor(
            Math.random()*3
        );

    const lane =
        lanes[laneIndex];

    const type =
        Math.random() < .5
            ? "barrier"
            : "train";

    let obstacle;


    if(type === "barrier"){

        obstacle =
            new THREE.Group();


        const body =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.7,
                    .75,
                    .7
                ),
                new THREE.MeshStandardMaterial({
                    color:0xff3d3d,
                    roughness:.55
                })
            );

        body.position.y = .45;

        obstacle.add(body);


        const stripe =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.72,
                    .16,
                    .72
                ),
                new THREE.MeshBasicMaterial({
                    color:0xffd52e
                })
            );

        stripe.position.y = .55;

        obstacle.add(stripe);


        const poleGeometry =
            new THREE.BoxGeometry(
                .12,
                1.1,
                .12
            );

        const poleMaterial =
            new THREE.MeshStandardMaterial({
                color:0x252a31
            });

        for(
            const x of [-.7,.7]
        ){

            const pole =
                new THREE.Mesh(
                    poleGeometry,
                    poleMaterial
                );

            pole.position.set(
                x,
                .55,
                0
            );

            obstacle.add(pole);
        }


        obstacle.userData.height = .9;
        obstacle.userData.type = "barrier";
    }


    else{

        obstacle =
            new THREE.Group();


        const trainBody =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.8,
                    2.1,
                    2.8
                ),
                new THREE.MeshStandardMaterial({
                    color:0x345b91,
                    roughness:.5,
                    metalness:.15
                })
            );

        trainBody.position.y = 1.05;

        obstacle.add(trainBody);


        const front =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    1.45,
                    .75,
                    .08
                ),
                new THREE.MeshBasicMaterial({
                    color:0x101923
                })
            );

        front.position.set(
            0,
            1.15,
            1.42
        );

        obstacle.add(front);


        const lightGeometry =
            new THREE.SphereGeometry(
                .1,
                6,
                6
            );

        const lightMaterial =
            new THREE.MeshBasicMaterial({
                color:0xffe38a
            });

        for(
            const x of [-.5,.5]
        ){

            const light =
                new THREE.Mesh(
                    lightGeometry,
                    lightMaterial
                );

            light.position.set(
                x,
                .72,
                1.48
            );

            obstacle.add(light);
        }


        obstacle.userData.height = 2.1;
        obstacle.userData.type = "train";
    }


    obstacle.position.set(
        lane,
        0,
        -55
    );

    obstacle.userData.lane =
        lane;

    scene.add(obstacle);

    obstacles.push(obstacle);
}


/* =========================================================
   COINS
========================================================= */

function createCoin(){

    const lane =
        lanes[
            Math.floor(
                Math.random()*3
            )
        ];


    const coin =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                .34,
                .105,
                8,
                16
            ),
            new THREE.MeshBasicMaterial({
                color:0xffd83d
            })
        );


    coin.position.set(
        lane,
        1.35,
        -55
    );


    coin.rotation.y =
        Math.PI/2;


    coin.userData.baseY =
        coin.position.y;

    coin.userData.phase =
        Math.random()*Math.PI*2;


    scene.add(coin);

    coins.push(coin);
}


/* =========================================================
   COIN LINE
========================================================= */

function createCoinLine(){

    const lane =
        lanes[
            Math.floor(
                Math.random()*3
            )
        ];


    for(
        let i=0;
        i<5;
        i++
    ){

        const coin =
            new THREE.Mesh(
                new THREE.TorusGeometry(
                    .34,
                    .105,
                    8,
                    16
                ),
                new THREE.MeshBasicMaterial({
                    color:0xffd83d
                })
            );


        coin.position.set(
            lane,
            1.35,
            -50 - i*2.3
        );


        coin.rotation.y =
            Math.PI/2;


        coin.userData.baseY =
            coin.position.y;

        coin.userData.phase =
            i*.7;


        scene.add(coin);

        coins.push(coin);
    }
}


/* =========================================================
   MOVEMENT
========================================================= */

function moveLeft(){

    if(!running) return;

    const index =
        lanes.indexOf(targetX);

    if(index > 0){

        targetX =
            lanes[index-1];
    }
}


function moveRight(){

    if(!running) return;

    const index =
        lanes.indexOf(targetX);

    if(index < lanes.length-1){

        targetX =
            lanes[index+1];
    }
}


function jump(){

    if(!running) return;

    if(grounded){

        velocityY = .27;

        grounded = false;

        playSound("jump");
    }
}


/* =========================================================
   START
========================================================= */

function startGame(){

    initAudio();

    playSound("start");


    document
        .getElementById("menu")
        .classList.add("hidden");

    document
        .getElementById("gameOver")
        .classList.add("hidden");


    obstacles.forEach(
        o => scene.remove(o)
    );

    coins.forEach(
        c => scene.remove(c)
    );


    obstacles = [];
    coins = [];


    score = 0;

    speed = .34;

    runTime = 0;


    updateLanes();


    playerX = 0;
    targetX = 0;


    player.position.set(
        0,
        0,
        3
    );


    velocityY = 0;
    grounded = true;


    spawnTimer = .7;
    coinTimer = .35;


    running = true;


    scoreEl.textContent = "0";
}


/* =========================================================
   GAME OVER
========================================================= */

function endGame(){

    if(!running) return;

    running = false;

    playSound("hit");


    const final =
        Math.floor(score);


    if(final > best){

        best = final;

        localStorage.setItem(
            "3dRunBest",
            best
        );
    }


    document
        .getElementById("finalScore")
        .textContent = final;

    document
        .getElementById("finalBest")
        .textContent = best;


    bestEl.textContent = best;


    document
        .getElementById("gameOver")
        .classList.remove("hidden");
}


/* =========================================================
   UPDATE
========================================================= */

function update(){

    if(!running) return;


    const delta =
        Math.min(
            clock.getDelta(),
            .033
        );


    runTime += delta;


    /*
       Smooth lane movement
    */

    playerX +=
        (targetX-playerX) *
        Math.min(
            1,
            delta*13
        );

    player.position.x =
        playerX;


    /*
       Jump physics
    */

    velocityY -=
        .85 * delta;

    player.position.y +=
        velocityY;


    if(
        player.position.y <= 0
    ){

        player.position.y = 0;

        velocityY = 0;

        grounded = true;
    }


    animatePlayer();


    /*
       Gradual speed increase
    */

    speed +=
        delta*.007;


    /*
       Keep speed reasonable
    */

    speed =
        Math.min(
            speed,
            .62
        );


    /*
       Obstacles
    */

    spawnTimer -= delta;


    if(spawnTimer <= 0){

        createObstacle();

        spawnTimer =
            Math.max(
                .65,
                .98 -
                speed*.45
            );
    }


    /*
       Coins
    */

    coinTimer -= delta;


    if(coinTimer <= 0){

        if(Math.random()<.65){

            createCoinLine();

        }else{

            createCoin();
        }

        coinTimer =
            1.0;
    }


    /*
       Move obstacles
    */

    for(
        let i=obstacles.length-1;
        i>=0;
        i--
    ){

        const obstacle =
            obstacles[i];


        obstacle.position.z +=
            speed*60*delta;


        /*
           Collision
        */

        const dx =
            Math.abs(
                obstacle.position.x -
                player.position.x
            );

        const dz =
            Math.abs(
                obstacle.position.z -
                player.position.z
            );


        let hitHeight =
            obstacle.userData.type === "train"
                ? 2.1
                : .9;


        const playerBottom =
            player.position.y;

        const playerTop =
            player.position.y + 2.45;


        const obstacleTop =
            hitHeight;


        if(
            dx < 1.05 &&
            dz < 1.25 &&
            playerBottom < obstacleTop
        ){

            /*
               Small barriers can be jumped.
            */

            if(
                obstacle.userData.type === "barrier" &&
                player.position.y > .75
            ){

                // Successfully jumped.

            }else{

                endGame();

                return;
            }
        }


        if(
            obstacle.position.z > 14
        ){

            scene.remove(
                obstacle
            );

            obstacles.splice(
                i,
                1
            );

            score += 8;
        }
    }


    /*
       Move coins
    */

    for(
        let i=coins.length-1;
        i>=0;
        i--
    ){

        const coin =
            coins[i];


        coin.position.z +=
            speed*60*delta;


        coin.rotation.z +=
            delta*7;


        coin.position.y =
            coin.userData.baseY +
            Math.sin(
                runTime*5 +
                coin.userData.phase
            )*.12;


        const dx =
            Math.abs(
                coin.position.x -
                player.position.x
            );

        const dy =
            Math.abs(
                coin.position.y -
                (player.position.y+1.2)
            );

        const dz =
            Math.abs(
                coin.position.z -
                player.position.z
            );


        if(
            dx < .85 &&
            dy < .9 &&
            dz < .9
        ){

            score += 20;

            playSound("coin");


            scene.remove(
                coin
            );

            coins.splice(
                i,
                1
            );

            continue;
        }


        if(
            coin.position.z > 13
        ){

            scene.remove(
                coin
            );

            coins.splice(
                i,
                1
            );
        }
    }


    /*
       Score
    */

    score +=
        delta*3;


    scoreEl.textContent =
        Math.floor(score);


    /*
       Move road markings toward player.
       Creates a strong speed sensation
       without moving the whole world.
    */

    scene.traverse(
        object => {

            if(
                object.userData &&
                object.userData.isRoadMarker
            ){

                object.position.z +=
                    speed*60*delta;

                if(
                    object.position.z > 8
                ){

                    object.position.z -=
                        132;
                }
            }


            if(
                object.userData &&
                object.userData.isEdgeLight
            ){

                object.position.z +=
                    speed*60*delta;

                if(
                    object.position.z > 8
                ){

                    object.position.z -=
                        132;
                }
            }
        }
    );
}


/* =========================================================
   ANIMATION LOOP
========================================================= */

function animate(){

    requestAnimationFrame(
        animate
    );

    update();

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio || 1,
            1.25
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    updateLanes();
    updateCamera();
}


/* =========================================================
   KEYBOARD
========================================================= */

window.addEventListener(
    "keydown",
    e => {

        const key =
            e.key.toLowerCase();


        if(
            key === "arrowleft" ||
            key === "a"
        ){

            moveLeft();
        }


        if(
            key === "arrowright" ||
            key === "d"
        ){

            moveRight();
        }


        if(
            key === "arrowup" ||
            key === " "
        ){

            e.preventDefault();

            jump();
        }
    }
);


/* =========================================================
   TOUCH SWIPE
========================================================= */

let touchStartX = 0;
let touchStartY = 0;

window.addEventListener(
    "touchstart",
    e => {

        if(!running) return;

        const touch =
            e.touches[0];

        touchStartX =
            touch.clientX;

        touchStartY =
            touch.clientY;
    },
    {passive:true}
);


window.addEventListener(
    "touchend",
    e => {

        if(!running) return;

        const touch =
            e.changedTouches[0];

        const dx =
            touch.clientX -
            touchStartX;

        const dy =
            touch.clientY -
            touchStartY;


        const threshold = 35;


        if(
            Math.abs(dx) >
            Math.abs(dy)
        ){

            if(
                dx > threshold
            ){

                moveRight();

            }else if(
                dx < -threshold
            ){

                moveLeft();
            }

        }else{

            if(
                dy < -threshold
            ){

                jump();
            }
        }
    },
    {passive:true}
);


/* =========================================================
   BUTTONS
========================================================= */

document
    .getElementById("left")
    .addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();
            moveLeft();
        }
    );


document
    .getElementById("right")
    .addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();
            moveRight();
        }
    );


document
    .getElementById("jump")
    .addEventListener(
        "pointerdown",
        e => {

            e.preventDefault();
            jump();
        }
    );


document
    .getElementById("start")
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById("restart")
    .addEventListener(
        "click",
        startGame
    );


/* =========================================================
   START
========================================================= */

init();

</script>
