<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>3D Obstacle Run | Mini Games</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

body {
    overflow: hidden;
    background: #050510;
    color: white;
    font-family: Arial, sans-serif;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    top: 20px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    pointer-events: none;
    z-index: 5;
}

.hudBox {
    background: rgba(10, 10, 30, 0.72);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 15px;
    padding: 10px 16px;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.25);
}

.hudLabel {
    font-size: 11px;
    opacity: .65;
    text-transform: uppercase;
}

.hudValue {
    font-size: 22px;
    font-weight: bold;
    margin-top: 2px;
}

#menu,
#gameOver {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    background: radial-gradient(
        circle at center,
        rgba(45,20,90,.65),
        rgba(3,3,12,.94)
    );
}

.panel {
    width: min(90%, 430px);
    text-align: center;
    padding: 35px 25px;
    border-radius: 28px;
    background: rgba(15,15,35,.88);
    border: 1px solid rgba(255,255,255,.13);
    box-shadow: 0 25px 70px rgba(0,0,0,.55);
    backdrop-filter: blur(14px);
}

h1 {
    font-size: clamp(34px, 8vw, 55px);
    margin-bottom: 10px;
    background: linear-gradient(90deg, #7c5cff, #00d9ff);
    -webkit-background-clip: text;
    color: transparent;
}

.panel p {
    color: #bcbcd0;
    line-height: 1.5;
    margin-bottom: 25px;
}

button {
    border: none;
    color: white;
    background: linear-gradient(
        135deg,
        #7657ff,
        #4169ff
    );
    padding: 15px 30px;
    border-radius: 15px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(80,70,255,.35);
    transition: transform .15s;
}

button:active {
    transform: scale(.94);
}

#controls {
    position: fixed;
    bottom: 25px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: center;
    gap: 20px;
    z-index: 6;
}

.control {
    width: 75px;
    height: 75px;
    border-radius: 22px;
    border: 1px solid rgba(255,255,255,.18);
    background: rgba(15,15,35,.72);
    color: white;
    font-size: 30px;
    backdrop-filter: blur(10px);
    user-select: none;
}

#jump {
    background: rgba(90,70,255,.65);
}

.hidden {
    display: none !important;
}

#back {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 7;
    padding: 8px 15px;
    font-size: 12px;
    background: rgba(15,15,35,.7);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: none;
}

@media (max-width: 500px) {

    #hud {
        top: 12px;
        left: 12px;
        right: 12px;
    }

    .hudBox {
        padding: 8px 12px;
    }

    .hudValue {
        font-size: 19px;
    }

    #controls {
        bottom: 18px;
        gap: 12px;
    }

    .control {
        width: 68px;
        height: 68px;
    }
}

@media (min-width: 700px) {

    #controls {
        opacity: .65;
    }

    .control {
        width: 65px;
        height: 65px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">

    <div class="hudBox">
        <div class="hudLabel">Score</div>
        <div class="hudValue" id="score">0</div>
    </div>

    <div class="hudBox">
        <div class="hudLabel">Best</div>
        <div class="hudValue" id="best">0</div>
    </div>

</div>

<a href="../index.html">
    <button id="back">← Mini Games</button>
</a>

<div id="menu">

    <div class="panel">

        <h1>3D RUN</h1>

        <p>
            Dodge the obstacles, collect coins and survive as long as possible.
            <br><br>
            PC: Arrow keys / A & D + Space
            <br>
            Mobile: Use the buttons
        </p>

        <button id="start">START RUN</button>

    </div>

</div>

<div id="gameOver" class="hidden">

    <div class="panel">

        <h1>GAME OVER</h1>

        <p>
            Your score:
            <strong id="finalScore">0</strong>

            <br><br>

            Best score:
            <strong id="finalBest">0</strong>
        </p>

        <button id="restart">RUN AGAIN</button>

    </div>

</div>

<div id="controls">

    <button class="control" id="left">←</button>

    <button class="control" id="jump">↑</button>

    <button class="control" id="right">→</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

let scene;
let camera;
let renderer;
let player;

let obstacles = [];
let coins = [];

let running = false;

let score = 0;

let best =
    Number(
        localStorage.getItem("3dRunBest")
    ) || 0;

let playerX = 0;
let targetX = 0;

let velocityY = 0;
let grounded = true;

let speed = 0.28;

let spawnTimer = 0;
let coinTimer = 0;

const scoreEl =
    document.getElementById("score");

const bestEl =
    document.getElementById("best");

bestEl.textContent = best;

const clock =
    new THREE.Clock();


/* =========================================================
   RESPONSIVE LANES
   ========================================================= */

function getLaneSpacing() {

    if (window.innerWidth < 500) {
        return 2.15;
    }

    if (window.innerWidth < 700) {
        return 2.4;
    }

    return 3;
}


let laneSpacing =
    getLaneSpacing();

let lanes = [
    -laneSpacing,
    0,
    laneSpacing
];


function updateLanes() {

    laneSpacing =
        getLaneSpacing();

    lanes = [
        -laneSpacing,
        0,
        laneSpacing
    ];

    const closestLane =
        lanes.reduce(
            (closest, lane) =>
                Math.abs(lane - targetX) <
                Math.abs(closest - targetX)
                    ? lane
                    : closest,
            lanes[0]
        );

    targetX = closestLane;

    playerX =
        Math.max(
            -laneSpacing,
            Math.min(
                laneSpacing,
                playerX
            )
        );
}


/* =========================================================
   MOBILE CAMERA
   ========================================================= */

function updateCamera() {

    if (window.innerWidth < 500) {

        camera.position.set(
            0,
            6.4,
            12.5
        );

    } else if (window.innerWidth < 700) {

        camera.position.set(
            0,
            5.9,
            10.5
        );

    } else {

        camera.position.set(
            0,
            5.5,
            9
        );
    }

    camera.lookAt(
        0,
        1,
        -12
    );
}


/* =========================================================
   SOUND SYSTEM
   ========================================================= */

let audioContext = null;

function initAudio() {

    if (!audioContext) {

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();
    }

    if (
        audioContext.state ===
        "suspended"
    ) {

        audioContext.resume();
    }
}


function playSound(type) {

    if (!audioContext) return;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    let startFrequency = 440;
    let endFrequency = 440;
    let duration = 0.1;
    let volume = 0.08;

    if (type === "start") {

        startFrequency = 420;
        endFrequency = 700;
        duration = 0.18;
        volume = 0.07;

        oscillator.type = "sine";
    }

    if (type === "coin") {

        startFrequency = 700;
        endFrequency = 1050;
        duration = 0.12;
        volume = 0.1;

        oscillator.type = "sine";
    }

    if (type === "jump") {

        startFrequency = 330;
        endFrequency = 560;
        duration = 0.12;
        volume = 0.06;

        oscillator.type = "sine";
    }

    if (type === "hit") {

        startFrequency = 130;
        endFrequency = 55;
        duration = 0.28;
        volume = 0.12;

        oscillator.type = "sawtooth";
    }

    oscillator.frequency.setValueAtTime(
        startFrequency,
        audioContext.currentTime
    );

    oscillator.frequency.exponentialRampToValueAtTime(
        Math.max(1, endFrequency),
        audioContext.currentTime + duration
    );

    gain.gain.setValueAtTime(
        0.001,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        volume,
        audioContext.currentTime + 0.01
    );

    gain.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + duration
    );
}


/* =========================================================
   INITIALIZATION
   ========================================================= */

function init() {

    scene =
        new THREE.Scene();

    scene.background =
        new THREE.Color(
            0x050510
        );

    scene.fog =
        new THREE.Fog(
            0x050510,
            18,
            70
        );

    camera =
        new THREE.PerspectiveCamera(
            65,
            window.innerWidth /
            window.innerHeight,
            0.1,
            200
        );

    updateCamera();

    renderer =
        new THREE.WebGLRenderer({
            antialias: true,
            powerPreference:
                "high-performance"
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            1.7
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.shadowMap.enabled = true;

    document
        .getElementById("game")
        .appendChild(
            renderer.domElement
        );

    createLights();

    createWorld();

    createPlayer();

    window.addEventListener(
        "resize",
        resize
    );

    animate();
}


/* =========================================================
   LIGHTS
   ========================================================= */

function createLights() {

    const ambient =
        new THREE.HemisphereLight(
            0x8899ff,
            0x111122,
            2
        );

    scene.add(ambient);

    const light =
        new THREE.DirectionalLight(
            0xffffff,
            2.5
        );

    light.position.set(
        5,
        12,
        8
    );

    light.castShadow = true;

    scene.add(light);
}


/* =========================================================
   WORLD
   ========================================================= */

function createWorld() {

    const ground =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                12,
                .5,
                160
            ),
            new THREE.MeshStandardMaterial({
                color: 0x17172d,
                roughness: .8
            })
        );

    ground.position.set(
        0,
        -.25,
        -60
    );

    ground.receiveShadow = true;

    scene.add(ground);


    const initialSpacing =
        getLaneSpacing();


    /*
       Visual lane separators.
       They are placed between the 3 playable lanes.
    */

    for (
        let x of [
            -initialSpacing / 2,
            initialSpacing / 2
        ]
    ) {

        const line =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .08,
                    .03,
                    160
                ),
                new THREE.MeshBasicMaterial({
                    color: 0x45457a
                })
            );

        line.position.set(
            x,
            .03,
            -60
        );

        scene.add(line);
    }


    // Side walls

    for (
        let x of [-6.2, 6.2]
    ) {

        const wall =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .35,
                    2,
                    160
                ),
                new THREE.MeshStandardMaterial({
                    color: 0x2a1f55,
                    emissive: 0x120a2c
                })
            );

        wall.position.set(
            x,
            .8,
            -60
        );

        scene.add(wall);
    }


    // Decorative lights

    for (
        let z = 0;
        z > -150;
        z -= 8
    ) {

        for (
            let x of [-5.5, 5.5]
        ) {

            const light =
                new THREE.Mesh(
                    new THREE.SphereGeometry(
                        .12,
                        8,
                        8
                    ),
                    new THREE.MeshBasicMaterial({
                        color: 0x00d9ff
                    })
                );

            light.position.set(
                x,
                1.7,
                z
            );

            scene.add(light);
        }
    }
}


/* =========================================================
   PLAYER
   ========================================================= */

function createPlayer() {

    player =
        new THREE.Group();


    const body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.15,
                1.35,
                .8
            ),
            new THREE.MeshStandardMaterial({
                color: 0x7657ff,
                roughness: .35,
                metalness: .15
            })
        );

    body.position.y = 1.15;

    body.castShadow = true;

    player.add(body);


    const head =
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .48,
                20,
                20
            ),
            new THREE.MeshStandardMaterial({
                color: 0xffc7a7
            })
        );

    head.position.y = 2.15;

    head.castShadow = true;

    player.add(head);


    const legMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x20204a
        });


    for (
        let x of [-.3, .3]
    ) {

        const leg =
            new THREE.Mesh(
                new THREE.BoxGeometry(
                    .25,
                    .75,
                    .3
                ),
                legMaterial
            );

        leg.position.set(
            x,
            .25,
            0
        );

        leg.castShadow = true;

        player.add(leg);
    }


    player.position.set(
        0,
        0,
        3
    );

    scene.add(player);
}


/* =========================================================
   OBSTACLE
   ========================================================= */

function createObstacle() {

    const lane =
        lanes[
            Math.floor(
                Math.random() *
                lanes.length
            )
        ];


    const height =
        .9 +
        Math.random() * 1.3;


    const obstacle =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.7,
                height,
                1.5
            ),
            new THREE.MeshStandardMaterial({
                color: 0xff315d,
                emissive: 0x4a0617,
                roughness: .35
            })
        );


    obstacle.position.set(
        lane,
        height / 2,
        -45
    );


    obstacle.castShadow = true;

    obstacle.userData.lane =
        lane;


    scene.add(obstacle);

    obstacles.push(obstacle);
}


/* =========================================================
   COIN
   ========================================================= */

function createCoin() {

    const safeLanes =
        lanes.filter(
            lane => {

                return !obstacles.some(
                    obstacle => {

                        const sameLane =
                            Math.abs(
                                obstacle.position.x -
                                lane
                            ) < 0.5;


                        const nearby =
                            Math.abs(
                                obstacle.position.z -
                                (-45)
                            ) < 18;


                        return (
                            sameLane &&
                            nearby
                        );
                    }
                );
            }
        );


    if (
        safeLanes.length === 0
    ) {
        return;
    }


    const lane =
        safeLanes[
            Math.floor(
                Math.random() *
                safeLanes.length
            )
        ];


    const coin =
        new THREE.Mesh(
            new THREE.TorusGeometry(
                .38,
                .12,
                12,
                24
            ),
            new THREE.MeshStandardMaterial({
                color: 0xffd83d,
                emissive: 0x5a3c00,
                metalness: .8,
                roughness: .2
            })
        );


    coin.position.set(
        lane,
        1.3 +
        Math.random() * .7,
        -45
    );


    coin.rotation.x =
        Math.PI / 2;


    scene.add(coin);

    coins.push(coin);
}


/* =========================================================
   MOVEMENT
   ========================================================= */

function moveLeft() {

    if (!running) return;

    const index =
        lanes.indexOf(targetX);


    if (index > 0) {

        targetX =
            lanes[index - 1];
    }
}


function moveRight() {

    if (!running) return;

    const index =
        lanes.indexOf(targetX);


    if (
        index <
        lanes.length - 1
    ) {

        targetX =
            lanes[index + 1];
    }
}


function jump() {

    if (!running) return;


    if (grounded) {

        velocityY = .24;

        grounded = false;

        playSound("jump");
    }
}


/* =========================================================
   START
   ========================================================= */

function startGame() {

    initAudio();

    playSound("start");


    document
        .getElementById("menu")
        .classList.add("hidden");


    document
        .getElementById("gameOver")
        .classList.add("hidden");


    obstacles.forEach(
        o => scene.remove(o)
    );


    coins.forEach(
        c => scene.remove(c)
    );


    obstacles = [];

    coins = [];


    score = 0;

    speed = .28;


    updateLanes();


    playerX = 0;

    targetX = 0;


    player.position.set(
        0,
        0,
        3
    );


    velocityY = 0;

    grounded = true;


    spawnTimer = 0;

    coinTimer = 0;


    running = true;


    scoreEl.textContent =
        "0";
}


/* =========================================================
   GAME OVER
   ========================================================= */

function endGame() {

    if (!running) return;


    running = false;

    playSound("hit");


    const final =
        Math.floor(score);


    if (
        final > best
    ) {

        best = final;


        localStorage.setItem(
            "3dRunBest",
            best
        );
    }


    document
        .getElementById(
            "finalScore"
        )
        .textContent = final;


    document
        .getElementById(
            "finalBest"
        )
        .textContent = best;


    bestEl.textContent =
        best;


    document
        .getElementById(
            "gameOver"
        )
        .classList.remove(
            "hidden"
        );
}


/* =========================================================
   UPDATE
   ========================================================= */

function update() {

    if (!running) return;


    const delta =
        Math.min(
            clock.getDelta(),
            .033
        );


    // Smooth lane movement

    playerX +=
        (targetX - playerX) *
        .18;


    player.position.x =
        playerX;


    // Jump physics

    velocityY -= .012;


    player.position.y +=
        velocityY;


    if (
        player.position.y <= 0
    ) {

        player.position.y = 0;

        velocityY = 0;

        grounded = true;
    }


    // Difficulty

    speed += .000035;


    // Obstacles

    spawnTimer -= delta;


    if (
        spawnTimer <= 0
    ) {

        createObstacle();


        spawnTimer =
            Math.max(
                .55,
                .95 -
                speed * .7
            );
    }


    // Coins

    coinTimer -= delta;


    if (
        coinTimer <= 0
    ) {

        createCoin();

        coinTimer = .75;
    }


    // Move obstacles

    for (
        let i = obstacles.length - 1;
        i >= 0;
        i--
    ) {

        const obstacle =
            obstacles[i];


        obstacle.position.z +=
            speed * 60 * delta;


        const dx =
            Math.abs(
                obstacle.position.x -
                player.position.x
            );


        const dy =
            Math.abs(
                obstacle.position.y -
                (player.position.y + 1)
            );


        const dz =
            Math.abs(
                obstacle.position.z -
                player.position.z
            );


        if (
            dx < 1.25 &&
            dy < 1.45 &&
            dz < 1.15
        ) {

            endGame();

            return;
        }


        if (
            obstacle.position.z > 12
        ) {

            scene.remove(
                obstacle
            );

            obstacles.splice(
                i,
                1
            );

            score += 5;
        }
    }


    // Move coins

    for (
        let i = coins.length - 1;
        i >= 0;
        i--
    ) {

        const coin =
            coins[i];


        coin.position.z +=
            speed * 60 * delta;


        coin.rotation.z += .08;


        const dx =
            Math.abs(
                coin.position.x -
                player.position.x
            );


        const dy =
            Math.abs(
                coin.position.y -
                (player.position.y + 1.2)
            );


        const dz =
            Math.abs(
                coin.position.z -
                player.position.z
            );


        if (
            dx < .9 &&
            dy < 1 &&
            dz < 1
        ) {

            score += 25;

            playSound("coin");


            scene.remove(
                coin
            );


            coins.splice(
                i,
                1
            );

            continue;
        }


        if (
            coin.position.z > 12
        ) {

            scene.remove(
                coin
            );


            coins.splice(
                i,
                1
            );
        }
    }


    score +=
        delta * 2;


    scoreEl.textContent =
        Math.floor(score);
}


/* =========================================================
   ANIMATION
   ========================================================= */

function animate() {

    requestAnimationFrame(
        animate
    );


    update();


    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
   ========================================================= */

function resize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    updateLanes();

    updateCamera();
}


/* =========================================================
   KEYBOARD
   ========================================================= */

window.addEventListener(
    "keydown",
    e => {

        if (
            e.key === "ArrowLeft" ||
            e.key.toLowerCase() === "a"
        ) {

            moveLeft();
        }


        if (
            e.key === "ArrowRight" ||
            e.key.toLowerCase() === "d"
        ) {

            moveRight();
        }


        if (
            e.key === "ArrowUp" ||
            e.key === " "
        ) {

            e.preventDefault();

            jump();
        }
    }
);


/* =========================================================
   BUTTONS
   ========================================================= */

document
    .getElementById("left")
    .addEventListener(
        "pointerdown",
        moveLeft
    );


document
    .getElementById("right")
    .addEventListener(
        "pointerdown",
        moveRight
    );


document
    .getElementById("jump")
    .addEventListener(
        "pointerdown",
        jump
    );


document
    .getElementById("start")
    .addEventListener(
        "click",
        startGame
    );


document
    .getElementById("restart")
    .addEventListener(
        "click",
        startGame
    );


/* =========================================================
   START ENGINE
   ========================================================= */

init();

</script>

</body>
</html>
