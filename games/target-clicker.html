<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Target Clicker | Mini Games</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #172554 0%, #050816 45%, #02030a 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-wrapper {
            width: 100%;
            max-width: 850px;
            text-align: center;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #a5b4fc;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            color: white;
        }

        h1 {
            font-size: clamp(2.2rem, 7vw, 4rem);
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 18px;
        }

        .stat {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 16px;
            padding: 14px;
        }

        .stat span {
            display: block;
            color: #94a3b8;
            font-size: 0.8rem;
            margin-bottom: 5px;
        }

        .stat strong {
            font-size: 1.5rem;
        }

        #gameArea {
            position: relative;
            width: 100%;
            height: 480px;
            overflow: hidden;
            border-radius: 24px;
            background:
                linear-gradient(
                    135deg,
                    rgba(30, 41, 59, 0.95),
                    rgba(15, 23, 42, 0.95)
                );
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .target {
            position: absolute;
            border: 5px solid white;
            border-radius: 50%;
            background:
                radial-gradient(
                    circle,
                    white 0 15%,
                    #ef4444 16% 40%,
                    white 41% 58%,
                    #ef4444 59% 100%
                );
            cursor: pointer;
            padding: 0;
            transition: transform 0.08s ease;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.65);
        }

        .target:hover {
            transform: scale(1.08);
        }

        .target:active {
            transform: scale(0.9);
        }

        .game-message {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .game-message h2 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .game-message p {
            color: #cbd5e1;
            font-size: 1.2rem;
        }

        #startBtn {
            margin-top: 20px;
            border: none;
            border-radius: 14px;
            padding: 14px 28px;
            background: white;
            color: #020617;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        #startBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,255,255,0.15);
        }

        @media (max-width: 600px) {

            body {
                padding: 12px;
            }

            #gameArea {
                height: 55vh;
                min-height: 350px;
            }

            .stats {
                gap: 8px;
            }

            .stat {
                padding: 10px 5px;
            }

            .stat strong {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body data-game="target-clicker">

    <main class="game-wrapper">

        <a href="../index.html" class="back">
            ← Back to Mini Games
        </a>

        <h1>🎯 Target Clicker</h1>

        <p class="subtitle">
            Click the targets as fast as you can!
        </p>

        <div class="stats">

            <div class="stat">
                <span>SCORE</span>
                <strong id="score">0</strong>
            </div>

            <div class="stat">
                <span>TIME</span>
                <strong id="time">30</strong>
            </div>

            <div class="stat">
                <span>BEST</span>
                <strong id="best">0</strong>
            </div>

        </div>

        <div id="gameArea">
            <div class="game-message">
                <h2>READY?</h2>
                <p>Press START and hit the targets!</p>
            </div>
        </div>

        <button id="startBtn">
            START GAME
        </button>

    </main>

    <script src="../js/games.js"></script>

</body>
</html>
