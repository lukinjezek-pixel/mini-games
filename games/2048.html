<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>2048 Mini | Mini Games</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, #172554 0%, #050816 45%, #02030a 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-wrapper {
            width: 100%;
            max-width: 520px;
            text-align: center;
        }

        .back {
            display: inline-block;
            margin-bottom: 18px;
            color: #a5b4fc;
            text-decoration: none;
            font-weight: bold;
        }

        .back:hover {
            color: white;
        }

        h1 {
            font-size: clamp(2.5rem, 10vw, 4rem);
            margin-bottom: 5px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .stat {
            min-width: 105px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.15);
            border-radius: 14px;
            padding: 10px 15px;
        }

        .stat span {
            display: block;
            color: #94a3b8;
            font-size: 0.72rem;
            margin-bottom: 3px;
        }

        .stat strong {
            font-size: 1.4rem;
        }

        #board {
            width: min(92vw, 480px);
            aspect-ratio: 1;
            margin: auto;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            background: rgba(30, 41, 59, 0.95);
            border-radius: 20px;
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
            touch-action: none;
        }

        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 12px;
            background: rgba(15, 23, 42, 0.8);
            font-size: clamp(1.4rem, 7vw, 2.7rem);
            font-weight: 900;
            color: white;
            transition: 0.12s;
        }

        .tile-2 {
            background: #334155;
        }

        .tile-4 {
            background: #475569;
        }

        .tile-8 {
            background: #64748b;
        }

        .tile-16 {
            background: #7c3aed;
        }

        .tile-32 {
            background: #9333ea;
        }

        .tile-64 {
            background: #c026d3;
        }

        .tile-128 {
            background: #db2777;
            font-size: clamp(1.2rem, 6vw, 2.3rem);
        }

        .tile-256 {
            background: #e11d48;
            font-size: clamp(1.2rem, 6vw, 2.3rem);
        }

        .tile-512 {
            background: #ea580c;
            font-size: clamp(1.2rem, 6vw, 2.3rem);
        }

        .tile-1024 {
            background: #f59e0b;
            font-size: clamp(1rem, 5vw, 2rem);
        }

        .tile-2048 {
            background: #facc15;
            color: #111827;
            font-size: clamp(1rem, 5vw, 2rem);
            box-shadow: 0 0 25px rgba(250, 204, 21, 0.5);
        }

        .controls {
            margin-top: 15px;
            color: #64748b;
            font-size: 0.9rem;
        }

        #restartBtn {
            margin-top: 15px;
            border: none;
            border-radius: 14px;
            padding: 13px 25px;
            background: white;
            color: #020617;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
        }

        #restartBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,255,255,0.15);
        }

        @media (max-width: 500px) {

            body {
                padding: 12px;
            }

            #board {
                gap: 7px;
                padding: 7px;
                border-radius: 16px;
            }

            .cell {
                border-radius: 9px;
            }

            .stats {
                gap: 7px;
            }

            .stat {
                min-width: 90px;
                padding: 8px 10px;
            }
        }
    </style>
</head>

<body data-game="2048">

    <main class="game-wrapper">

        <a href="../index.html" class="back">
            ← Back to Mini Games
        </a>

        <h1>🧩 2048</h1>

        <p class="subtitle">
            Combine the numbers and reach 2048!
        </p>

        <div class="stats">

            <div class="stat">
                <span>SCORE</span>
                <strong id="score">0</strong>
            </div>

            <div class="stat">
                <span>BEST</span>
                <strong id="best">0</strong>
            </div>

        </div>

        <div id="board"></div>

        <p class="controls">
            Use your arrow keys ⬆️ ⬇️ ⬅️ ➡️
        </p>

        <button id="restartBtn">
            NEW GAME
        </button>

    </main>

    <script src="../js/games.js"></script>

</body>
</html>
