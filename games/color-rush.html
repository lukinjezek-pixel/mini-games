<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Color Rush</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .game-container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 25px;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    .stat {
      flex: 1;
      background: #1d1d1d;
      border-radius: 14px;
      padding: 14px 10px;
      border: 1px solid #333;
    }

    .stat-title {
      color: #999;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
    }

    .target-box {
      background: #1d1d1d;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 25px 15px;
      margin-bottom: 20px;
    }

    .target-label {
      color: #aaa;
      font-size: 15px;
      margin-bottom: 8px;
    }

    #targetColor {
      font-size: 34px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .colors {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .color-button {
      height: 100px;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      transition: transform 0.08s, filter 0.08s;
    }

    .color-button:hover {
      filter: brightness(1.15);
    }

    .color-button:active {
      transform: scale(0.93);
    }

    .red {
      background: #ff3b30;
    }

    .blue {
      background: #3478f6;
    }

    .green {
      background: #34c759;
    }

    .yellow {
      background: #ffd60a;
    }

    .purple {
      background: #af52de;
    }

    .orange {
      background: #ff9500;
    }

    #message {
      min-height: 25px;
      margin: 18px 0;
      font-weight: bold;
    }

    .correct {
      color: #34c759;
    }

    .wrong {
      color: #ff453a;
    }

    .start-button,
    .restart-button,
    .back-button {
      border: none;
      border-radius: 12px;
      padding: 13px 22px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }

    .start-button,
    .restart-button {
      background: white;
      color: #111;
    }

    .back-button {
      background: #222;
      color: white;
      border: 1px solid #444;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #gameOver {
      display: none;
      background: #1d1d1d;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 25px;
      margin-top: 20px;
    }

    #gameOver h2 {
      margin-top: 0;
      font-size: 30px;
    }

    .final-score {
      font-size: 22px;
      margin: 10px 0;
    }

    .new-record {
      color: #ffd60a;
      font-weight: bold;
    }

    @media (max-width: 500px) {

      h1 {
        font-size: 34px;
      }

      .color-button {
        height: 85px;
      }

      #targetColor {
        font-size: 28px;
      }

    }

  </style>

</head>


<body>

  <div class="game-container">

    <h1>🎨 Color Rush</h1>

    <p class="subtitle">
      Click the correct color as fast as you can!
    </p>


    <!-- STATS -->

    <div class="stats">

      <div class="stat">

        <div class="stat-title">
          SCORE
        </div>

        <div class="stat-value" id="score">
          0
        </div>

      </div>


      <div class="stat">

        <div class="stat-title">
          TIME
        </div>

        <div class="stat-value" id="time">
          30
        </div>

      </div>


      <div class="stat">

        <div class="stat-title">
          BEST
        </div>

        <div class="stat-value" id="best">
          0
        </div>

      </div>

    </div>


    <!-- TARGET -->

    <div class="target-box">

      <div class="target-label">
        CLICK THIS COLOR
      </div>

      <div id="targetColor">
        PRESS START
      </div>

    </div>


    <!-- COLORS -->

    <div class="colors">

      <button class="color-button red"
        data-color="red"
        aria-label="Red">
      </button>

      <button class="color-button blue"
        data-color="blue"
        aria-label="Blue">
      </button>

      <button class="color-button green"
        data-color="green"
        aria-label="Green">
      </button>

      <button class="color-button yellow"
        data-color="yellow"
        aria-label="Yellow">
      </button>

      <button class="color-button purple"
        data-color="purple"
        aria-label="Purple">
      </button>

      <button class="color-button orange"
        data-color="orange"
        aria-label="Orange">
      </button>

    </div>


    <div id="message"></div>


    <button
      class="start-button"
      id="startButton">
      START GAME
    </button>


    <!-- GAME OVER -->

    <div id="gameOver">

      <h2>🏆 Game Over!</h2>

      <div class="final-score">
        Your score:
        <strong id="finalScore">0</strong>
      </div>

      <div
        class="new-record"
        id="recordMessage">
      </div>

      <button
        class="restart-button"
        id="restartButton">
        PLAY AGAIN
      </button>

    </div>


    <br>

    <button
      class="back-button"
      onclick="location.href='../index.html'">
      ← BACK TO MINI GAMES
    </button>

  </div>


  <script>

    // -----------------------------
    // GAME VARIABLES
    // -----------------------------

    const colors = [
      "red",
      "blue",
      "green",
      "yellow",
      "purple",
      "orange"
    ];

    const colorNames = {
      red: "RED",
      blue: "BLUE",
      green: "GREEN",
      yellow: "YELLOW",
      purple: "PURPLE",
      orange: "ORANGE"
    };

    let score = 0;
    let timeLeft = 30;
    let target = "";
    let gameRunning = false;
    let timer;
    let speed = 1000;


    // -----------------------------
    // ELEMENTS
    // -----------------------------

    const scoreElement =
      document.getElementById("score");

    const timeElement =
      document.getElementById("time");

    const bestElement =
      document.getElementById("best");

    const targetElement =
      document.getElementById("targetColor");

    const messageElement =
      document.getElementById("message");

    const startButton =
      document.getElementById("startButton");

    const gameOver =
      document.getElementById("gameOver");

    const finalScore =
      document.getElementById("finalScore");

    const restartButton =
      document.getElementById("restartButton");

    const recordMessage =
      document.getElementById("recordMessage");


    // -----------------------------
    // BEST SCORE
    // -----------------------------

    let bestScore =
      Number(localStorage.getItem("colorRushBest")) || 0;

    bestElement.textContent = bestScore;


    // -----------------------------
    // SOUND
    // -----------------------------

    let audioContext;

    function playSound(type) {

      try {

        if (!audioContext) {
          audioContext =
            new (window.AudioContext ||
            window.webkitAudioContext)();
        }

        const oscillator =
          audioContext.createOscillator();

        const gain =
          audioContext.createGain();

        oscillator.connect(gain);
        gain.connect(audioContext.destination);

        if (type === "correct") {

          oscillator.frequency.value = 700;

        } else if (type === "wrong") {

          oscillator.frequency.value = 180;

        } else {

          oscillator.frequency.value = 400;

        }

        gain.gain.setValueAtTime(
          0.08,
          audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime + 0.12
        );

        oscillator.start();

        oscillator.stop(
          audioContext.currentTime + 0.12
        );

      } catch (error) {

        // Sound is optional.

      }

    }


    // -----------------------------
    // NEW TARGET
    // -----------------------------

    function newTarget() {

      target =
        colors[Math.floor(
          Math.random() * colors.length
        )];

      targetElement.textContent =
        colorNames[target];

    }


    // -----------------------------
    // START GAME
    // -----------------------------

    function startGame() {

      clearInterval(timer);

      score = 0;
      timeLeft = 30;
      speed = 1000;
      gameRunning = true;

      scoreElement.textContent = score;
      timeElement.textContent = timeLeft;

      messageElement.textContent = "";
      messageElement.className = "";

      gameOver.style.display = "none";

      startButton.disabled = true;
      startButton.textContent = "GAME RUNNING";

      newTarget();

      timer = setInterval(() => {

        timeLeft--;

        timeElement.textContent =
          timeLeft;

        if (timeLeft <= 0) {

          endGame();

        }

      }, 1000);

    }


    // -----------------------------
    // COLOR CLICK
    // -----------------------------

    document
      .querySelectorAll(".color-button")
      .forEach(button => {

        button.addEventListener("click", () => {

          if (!gameRunning) {
            return;
          }

          const clickedColor =
            button.dataset.color;


          // CORRECT

          if (clickedColor === target) {

            score++;

            scoreElement.textContent =
              score;

            messageElement.textContent =
              "✓ CORRECT!";

            messageElement.className =
              "correct";

            playSound("correct");


            // Make the game faster

            if (speed > 400) {
              speed -= 50;
            }


            newTarget();

          }


          // WRONG

          else {

            timeLeft -= 2;

            if (timeLeft < 0) {
              timeLeft = 0;
            }

            timeElement.textContent =
              timeLeft;

            messageElement.textContent =
              "✗ WRONG! -2 seconds";

            messageElement.className =
              "wrong";

            playSound("wrong");

            if (timeLeft <= 0) {
              endGame();
            }

          }

        });

      });


    // -----------------------------
    // END GAME
    // -----------------------------

    function endGame() {

      if (!gameRunning) {
        return;
      }

      gameRunning = false;

      clearInterval(timer);

      targetElement.textContent =
        "GAME OVER";

      startButton.disabled = false;
      startButton.textContent = "START GAME";

      finalScore.textContent =
        score;

      gameOver.style.display =
        "block";


      if (score > bestScore) {

        bestScore = score;

        localStorage.setItem(
          "colorRushBest",
          bestScore
        );

        bestElement.textContent =
          bestScore;

        recordMessage.textContent =
          "🔥 NEW HIGH SCORE!";

      } else {

        recordMessage.textContent =
          "Best score: " + bestScore;

      }

    }


    // -----------------------------
    // BUTTONS
    // -----------------------------

    startButton.addEventListener(
      "click",
      startGame
    );

    restartButton.addEventListener(
      "click",
      startGame
    );

  </script>

</body>

</html>
