<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Mini Games</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

  <div class="container">


    <!-- =========================
         HERO
    ========================== -->

    <header class="hero">

      <div class="logo">
        🎮
      </div>

      <h1>
        Mini Games
      </h1>

      <p>
        Small games. Big fun.
      </p>

      <div class="hero-line"></div>

    </header>


    <!-- =========================
         GAMES
    ========================== -->

    <main>

      <h2 class="section-title">
        Choose a game
      </h2>


      <div class="games">


        <!-- REACTION TEST -->

        <div class="game">

          <div class="game-icon">
            ⚡
          </div>

          <h2>
            Reaction Test
          </h2>

          <p>
            How fast are your reactions?
          </p>

          <a href="games/reaction.html">

            <button type="button">
              PLAY NOW
            </button>

          </a>

        </div>


        <!-- GUESS THE NUMBER -->

        <div class="game">

          <div class="game-icon">
            🔢
          </div>

          <h2>
            Guess the Number
          </h2>

          <p>
            Can you guess the secret number?
          </p>

          <a href="games/guess.html">

            <button type="button">
              PLAY NOW
            </button>

          </a>

        </div>


        <!-- IMPOSSIBLE CHOICE -->

        <div class="game">

          <div class="game-icon">
            🤔
          </div>

          <h2>
            Impossible Choice
          </h2>

          <p>
            Choose between two impossible options.
          </p>

          <a href="games/impossible-choice.html">

            <button type="button">
              PLAY NOW
            </button>

          </a>

        </div>


      </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

      <p>
        © 2026 Mini Games
      </p>

      <p>
        More games coming soon...
      </p>

    </footer>


  </div>


  <!-- =========================
       SOUND
  ========================== -->

  <script>

    let audioContext = null;


    function playClickSound() {

      try {

        if (!audioContext) {

          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();

        }


        if (
          audioContext.state ===
          "suspended"
        ) {

          audioContext.resume();

        }


        const oscillator =
          audioContext.createOscillator();


        const gain =
          audioContext.createGain();


        oscillator.type =
          "square";


        oscillator.frequency.setValueAtTime(
          700,
          audioContext.currentTime
        );


        oscillator.frequency.exponentialRampToValueAtTime(
          450,
          audioContext.currentTime + 0.12
        );


        gain.gain.setValueAtTime(
          0.08,
          audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
          0.001,
          audioContext.currentTime + 0.12
        );


        oscillator.connect(gain);

        gain.connect(
          audioContext.destination
        );


        oscillator.start();


        oscillator.stop(
          audioContext.currentTime + 0.12
        );

      } catch (error) {

        console.log(
          "Sound error:",
          error
        );

      }

    }


    document
      .querySelectorAll(".game a")
      .forEach(function(link) {

        link.addEventListener(
          "click",
          function(event) {

            event.preventDefault();


            const destination =
              link.href;


            // 🔊 PLAY SOUND

            playClickSound();


            // ⏱️ WAIT FOR SOUND

            setTimeout(
              function() {

                window.location.href =
                  destination;

              },
              180
            );

          }
        );

      });

  </script>


</body>

</html>
