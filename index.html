  <!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mini Games</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <header class="hero">

      <div class="logo">🎮</div>

      <h1>Mini Games</h1>

      <p>Small games. Big fun.</p>

      <div class="hero-line"></div>

    </header>


    <main>

      <h2 class="section-title">
        Choose a game
      </h2>


      <div class="games">


        <!-- Reaction Test -->

        <div class="game">

          <div class="game-icon">
            ⚡
          </div>

          <h2>
            Reaction Test
          </h2>

          <p>
            How fast are your reactions?
          </p>

          <a href="games/reaction.html">
            <button>
              PLAY NOW
            </button>
          </a>

        </div>


        <!-- Guess the Number -->

        <div class="game">

          <div class="game-icon">
            🔢
          </div>

          <h2>
            Guess the Number
          </h2>

          <p>
            Can you guess the secret number?
          </p>

          <a href="games/guess.html">
            <button>
              PLAY NOW
            </button>
          </a>

        </div>


        <!-- Impossible Choice -->

        <div class="game">

          <div class="game-icon">
            🤔
          </div>

          <h2>
            Impossible Choice
          </h2>

          <p>
            Choose between two impossible options.
          </p>

          <button onclick="comingSoon()">
            PLAY NOW
          </button>

        </div>


      </div>

    </main>


    <footer>

      <p>
        © 2026 Mini Games
      </p>

      <p>
        More games coming soon...
      </p>

    </footer>

  </div>


  <script>

    function comingSoon() {

      alert("This game is coming soon! 🎮");

    }

  </script>


</body>

</html>
